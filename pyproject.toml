[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-dyno"
version = "0.2.1"
description = "AI safety and alignment research lab: probes, interventions, SAE experiments, SDK and APIs, powered by local MLX inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
  "mlx", "apple-silicon", "macos", "llm", "inference", "server",
  "metrics", "prometheus", "observability", "local-llm",
]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
# `dyno top` needs nothing heavy. MLX is only required to serve a model.
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
serve = ["mlx-lm>=0.28"]
mcp = ["mcp>=1.28,<2"]
docs = ["markdown>=3.7,<4"]

[project.scripts]
dyno = "dyno.cli:main"

[project.urls]
Homepage = "https://dynolab.dev"
Documentation = "https://dynolab.dev/guide.html"
Repository = "https://github.com/canivel/dynolab"
Issues = "https://github.com/canivel/dynolab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dyno"]
