name: Release macOS app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag to build as a draft release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    name: Build reviewed release
    runs-on: macos-15
    timeout-minutes: 60
    environment: release-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          enable-cache: false
      - name: Verify tag, reviewed ancestry, version and architecture
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          test "$(uname -m)" = arm64
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Install locked test dependencies
        run: uv sync --locked --extra mcp --extra docs --extra pool --python 3.12
      - name: Test API, SDK, MCP and documentation
        run: |
          PYTHONPATH=src uv run --frozen python -m unittest discover -s tests -v
          uv run --frozen python scripts/check-docs.py
      - name: Test native behavior
        run: swift test --package-path app
      - name: Build distributions and dependency inventory
        run: |
          uv build
          uv export --frozen --extra serve --extra mcp --extra pool --no-dev --no-emit-project --format cyclonedx1.5 -o dist/runtime-sbom.json
          cp docs/release-notes.md dist/release-notes.md
          cp uv.lock dist/uv.lock
      - name: Build pinned pool research runtime
        run: |
          git init "$RUNNER_TEMP/dyno-llama"
          git -C "$RUNNER_TEMP/dyno-llama" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/dyno-llama" fetch --depth 1 origin 5bda51bfbc62e64193221e639f6ad4e08767d760
          git -C "$RUNNER_TEMP/dyno-llama" checkout --detach FETCH_HEAD
          uv run --frozen python scripts/llama/build-capture.py "$RUNNER_TEMP/dyno-llama"
          cp "$RUNNER_TEMP/dyno-llama/LICENSE" "$RUNNER_TEMP/dyno-llama/build-dyno/bin/llama-LICENSE"
          echo "DYNO_POOL_RUNTIME_DIR=$RUNNER_TEMP/dyno-llama/build-dyno/bin" >> "$GITHUB_ENV"
      - name: Import release signing credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Missing signing certificate}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${APPLE_ID:?Missing Apple ID}"
          : "${APPLE_APP_PASSWORD:?Missing notarization password}"
          : "${APPLE_TEAM_ID:?Missing Apple team ID}"
          KEYCHAIN="$RUNNER_TEMP/dyno-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials dynolab-release --keychain "$KEYCHAIN" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build and verify DMG
        env:
          DYNO_SIGN_IDENTITY: ${{ vars.APPLE_SIGN_IDENTITY }}
          DYNO_NOTARY_PROFILE: dynolab-release
          DYNO_NOTARY_KEYCHAIN: ${{ runner.temp }}/dyno-signing.keychain-db
        run: |
          : "${DYNO_SIGN_IDENTITY:?Missing Developer ID signing identity}"
          ./app/package-dmg.sh
          spctl --assess --type open --context context:primary-signature --verbose=2 app/build/*.dmg
          cp app/build/*.dmg app/build/*.sha256 app/build/*.notary.json dist/
          (cd dist && shasum -a 256 *.dmg *.whl *.tar.gz *.notary.json runtime-sbom.json uv.lock release-notes.md > SHA256SUMS)
      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -f "$RUNNER_TEMP/dyno-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/dyno-signing.keychain-db"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-release
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Attest and create draft
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # This job never checks out the repository or executes the built app.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-release
          path: dist
      - name: Verify transferred artifacts
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.dmg
            dist/*.whl
            dist/*.tar.gz
            dist/runtime-sbom.json
      - name: Create a draft for maintainer smoke testing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --draft --verify-tag \
            --title "Dyno $RELEASE_TAG" --notes-file dist/release-notes.md
